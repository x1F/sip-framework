name: Java Maven Defaults
description: installs java, maven and configures a git identity

inputs:
  gpg-key:
    description: the gpg key used for signing packages
    required: true

runs:
  using: "composite"
  steps:
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'maven'

    - name: Cache Maven packages
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: Import GPG key
      run: |
        echo "${{ inputs.gpg-key }}" | gpg --batch --import
      shell: bash

    - name: Configure git identity
      run:  |
        git config --global user.email "sip-dev@ikor.de"
        git config --global user.name "GitHub Actions"
      shell: bash
